name: JoJo source checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Audit the public source allowlist
        run: python jojo_release.py --check
      - name: Check Python syntax without starting hardware or services
        run: python -m compileall -q -x "(.venv|scratch|jojo_release)" .
      - name: Pure release/privacy tests
        run: python -m unittest discover -s tests -p test_jojo_release.py
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Isolated behavioral regression tests
        run: python -m unittest discover -s tests
      - name: Native backend startup and shutdown smoke
        run: python tests/smoke_local_server.py
